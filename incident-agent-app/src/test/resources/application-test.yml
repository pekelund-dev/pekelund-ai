# Test profile — no MCP client or Gemini connection required
spring:
  datasource:
    url: jdbc:h2:mem:agent_testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

  ai:
    google:
      genai:
        api-key: test-key
        chat:
          options:
            model: gemini-2.0-flash
    a2a:
      server:
        enabled: false  # Disable A2A HTTP infrastructure in unit tests
    mcp:
      client:
        enabled: false  # Disable MCP client so no connection is attempted in tests
