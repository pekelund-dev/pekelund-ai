# Test profile — no MCP client or OpenAI connection required
spring:
  datasource:
    url: jdbc:h2:mem:agent_testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

  ai:
    openai:
      api-key: test-key
      chat:
        options:
          model: gpt-4o-mini
    mcp:
      client:
        enabled: false  # Disable MCP client so no connection is attempted in tests
