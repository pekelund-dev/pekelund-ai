# Test profile — uses H2 in-memory database so no external PostgreSQL is needed
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false   # Flyway requires PostgreSQL dialect features; use Hibernate DDL for tests
  ai:
    mcp:
      server:
        name: incident-tools-mcp-server-test
        version: 1.0.0
        type: SYNC
