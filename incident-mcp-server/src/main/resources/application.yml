server:
  port: 8081

spring:
  application:
    name: incident-mcp-server

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/itii_db}
    username: ${DB_USERNAME:itii}
    password: ${DB_PASSWORD:itii_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate    # Schema is managed by Flyway — Hibernate only validates
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # ─── Spring AI MCP Server ────────────────────────────────────────────────────
  # The spring-ai-mcp-server-spring-boot-starter auto-configures:
  #   • An MCP-compliant server (SYNC mode — one thread per request)
  #   • HTTP/SSE transport via Spring MVC
  #     - GET  /sse              → SSE stream that clients subscribe to
  #     - POST /mcp/message      → clients send tool-call requests here
  # ─────────────────────────────────────────────────────────────────────────────
  ai:
    mcp:
      server:
        name: incident-tools-mcp-server
        version: 1.0.0
        type: SYNC
        # SSE endpoint path — clients connect to http://host:8081/sse
        sse-message-endpoint: /mcp/message

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    dev.pekelund.ai: DEBUG
    org.springframework.ai: INFO
