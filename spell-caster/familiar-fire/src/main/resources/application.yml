spring:
  application:
    name: familiar-fire
  datasource:
    url: jdbc:h2:mem:librarium;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always

server:
  port: 8091

logging:
  level:
    dev.pekelund: DEBUG
    org.springframework.ai: INFO
