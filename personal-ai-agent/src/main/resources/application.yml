spring:
  application:
    name: personal-ai-agent
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            # gemini-2.0-flash is the cost-efficient flash-tier model that supports tool calling.
            # Override with GEMINI_MODEL env var (e.g. gemini-2.0-flash-lite for even lower cost,
            # or gemini-2.5-pro for maximum capability).
            model: ${GEMINI_MODEL:gemini-2.0-flash}
            temperature: 0.7
            # Limit output tokens to reduce cost – increase if responses get cut off
            max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:1024}

server:
  port: 8085

google:
  credentials:
    file: ${GOOGLE_CREDENTIALS_FILE:credentials.json}
  tokens:
    dir: ${GOOGLE_TOKENS_DIR:tokens}

personal:
  notes:
    file: ${NOTES_FILE:notes.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    dev.pekelund: DEBUG
    org.springframework.ai: INFO
