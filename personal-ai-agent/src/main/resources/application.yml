spring:
  application:
    name: personal-ai-agent
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            # Default model used for autoconfiguration; overridden per-request by AgentService.
            model: gemini-2.0-flash
            temperature: 0.7

server:
  port: 8085

google:
  credentials:
    file: ${GOOGLE_CREDENTIALS_FILE:credentials.json}
  tokens:
    dir: ${GOOGLE_TOKENS_DIR:tokens}

personal:
  notes:
    file: ${NOTES_FILE:notes.json}
  agent:
    # Classification model — cheapest/fastest, only outputs one word
    router-model: ${GEMINI_ROUTER_MODEL:gemini-2.0-flash-lite}
    # LLM for simple single-step tasks (weather, time, reading emails, basic calendar checks)
    simple-model: ${GEMINI_SIMPLE_MODEL:gemini-2.0-flash}
    simple-max-tokens: ${GEMINI_SIMPLE_MAX_TOKENS:1024}
    # LRM for complex multi-step tasks (drafting, analysis, reasoning across multiple services)
    complex-model: ${GEMINI_COMPLEX_MODEL:gemini-2.5-pro}
    complex-max-tokens: ${GEMINI_COMPLEX_MAX_TOKENS:4096}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    dev.pekelund: DEBUG
    org.springframework.ai: INFO
