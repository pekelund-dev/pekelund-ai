spring:
  application:
    name: personal-ai-agent
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.0-flash
            temperature: 0.7

server:
  port: 8085

google:
  credentials:
    file: ${GOOGLE_CREDENTIALS_FILE:credentials.json}
  tokens:
    dir: ${GOOGLE_TOKENS_DIR:tokens}

personal:
  notes:
    file: ${NOTES_FILE:notes.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    dev.pekelund: DEBUG
    org.springframework.ai: INFO
